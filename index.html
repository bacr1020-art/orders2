<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>إدارة الطلبات</title>
<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--pr:#4f46e5;--ok:#059669;--wa:#d97706;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b1f26;--tx:#eef0f3;--mu:#9aa3af;--pr:#818cf8;--ok:#4ade80;--wa:#fbbf24;--bd:#2a303a}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b1f26;--tx:#eef0f3;--mu:#9aa3af;--pr:#818cf8;--ok:#4ade80;--wa:#fbbf24;--bd:#2a303a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:70px}
header{padding:calc(18px + env(safe-area-inset-top,0px)) 18px 22px;margin:calc(-1*env(safe-area-inset-top,0px)) 0 14px;font-weight:800;font-size:20px;color:#fff;background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:0 0 24px 24px;box-shadow:0 6px 18px rgba(79,70,229,.3)}
main{padding:0 12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;padding:10px 4px;border:0;background:none;color:var(--mu);font-size:14px;font-family:inherit}
nav button.on{color:var(--pr);font-weight:700}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.card{box-shadow:0 2px 8px rgba(0,0,0,.04)}.sm{border-radius:10px}.chips{display:flex;gap:6px;margin-bottom:10px}
.chip{flex:1;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-family:inherit}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.btn{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 6px 14px rgba(79,70,229,.35);font-size:16px;color:#fff;font:inherit;font-weight:700;margin-top:14px}
.sm{padding:7px 10px;border-radius:8px;border:1px solid var(--bd);background:none;color:var(--tx);font:inherit;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:13px;line-height:1.7}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid}
.done{color:var(--ok)}.pend{color:var(--wa)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi b{display:block;font-size:20px;margin-top:4px}
.bar{height:8px;border-radius:4px;background:var(--pr);margin-top:4px}
h3{margin:14px 0 8px;font-size:15px}
.last{border-color:var(--pr)}
</style>
</head>
<body>
<header>📦 إدارة الطلبات</header>
<main id="app"></main>
<nav>
 <button data-t="list" class="on"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>الطلبات</button>
 <button data-t="new"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>طلب جديد</button>
 <button data-t="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>التحليل</button>
</nav>
<script>
const GOV=["بغداد","البصرة","نينوى","أربيل","السليمانية","دهوك","كركوك","الأنبار","صلاح الدين","ديالى","بابل","كربلاء","النجف","القادسية","واسط","ميسان","ذي قار","المثنى"];
let orders=[];
try{orders=JSON.parse(localStorage.getItem("orders")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("orders",JSON.stringify(orders))}catch(e){}};
let tab="list",flt="all";
const $=s=>document.querySelector(s);
const fm=n=>Math.round(n).toLocaleString("en-US");
const tot=o=>(+o.price||0)+(+o.delivery||0);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function card(o,isLast){
 return `<div class="card ${isLast?'last':''}">
 <div class="row"><b>${esc(o.name)}</b><span class="tag ${o.done?'done':'pend'}">${o.done?'مكتمل':'غير مكتمل'}</span></div>
 <div class="mu">📞 ${esc(o.phone)}<br>📍 ${esc(o.gov)} - ${esc(o.district)} - ${esc(o.landmark)}<br>🏠 ${esc(o.address)}<br>🛍️ ${esc(o.type)}<br>💰 المنتج ${fm(o.price)} + توصيل ${fm(o.delivery)} = <b>${fm(tot(o))}</b>${o.note?'<br>📝 '+esc(o.note):''}<br>🕒 ${new Date(o.date).toLocaleDateString("ar-IQ")}</div>
 <div class="row" style="margin-top:8px"><button class="sm" onclick="tog('${o.id}')">${o.done?'إرجاع لغير مكتمل':'تم الإكمال ✓'}</button><button class="sm" onclick="del('${o.id}')">حذف</button></div></div>`;
}
function list(){
 const sorted=[...orders].sort((a,b)=>b.date-a.date);
 let h="";
 if(sorted.length&&flt==="all")h+=`<h3>آخر طلب</h3>`+card(sorted[0],true)+`<h3>كل الطلبات</h3>`;
 const f=sorted.filter(o=>flt==="all"||(flt==="done"?o.done:!o.done));
 h=`<div class="chips">${[["all","الكل"],["done","المكتملة"],["pend","غير المكتملة"]].map(([k,t])=>`<button class="chip ${flt===k?'on':''}" onclick="flt='${k}';render()">${t} ${k==="all"?orders.length:orders.filter(o=>k==="done"?o.done:!o.done).length}</button>`).join("")}</div>`+h;
 h+=f.length?f.map(o=>card(o)).join(""):`<div class="card mu">لا توجد طلبات.</div>`;
 return h;
}
function form(){
 const f=(id,l,t="text")=>`<label>${l}</label><input id="${id}" type="${t}">`;
 return `<div class="card">${f("name","اسم العميل")}${f("phone","رقم الهاتف","tel")}
 <label>المحافظة</label><select id="gov">${GOV.map(g=>`<option>${g}</option>`).join("")}</select>
 ${f("district","القضاء")}${f("landmark","أقرب نقطة دالة")}${f("address","العنوان")}${f("type","نوع الطلب")}
 ${f("price","سعر المنتج","number")}${f("delivery","سعر التوصيل","number")}${f("cost","تكلفة المنتج عليك (لحساب الربح)","number")}
 <label>ملاحظات</label><textarea id="note" rows="2"></textarea>
 <button class="btn" onclick="add()">حفظ الطلب</button></div>`;
}
function add(){
 const v=i=>$("#"+i).value.trim();
 if(!v("name")||!v("phone")){alert("اكتب اسم العميل ورقم الهاتف");return}
 orders.push({id:Date.now()+"",date:Date.now(),done:false,name:v("name"),phone:v("phone"),gov:v("gov"),district:v("district"),landmark:v("landmark"),address:v("address"),type:v("type"),price:+v("price")||0,delivery:+v("delivery")||0,cost:+v("cost")||0,note:v("note")});
 save();tab="list";flt="all";render();
}
function tog(id){const o=orders.find(x=>x.id===id);o.done=!o.done;save();render()}
function del(id){if(confirm("حذف الطلب؟")){orders=orders.filter(x=>x.id!==id);save();render()}}
function stats(){
 const d=orders.filter(o=>o.done),now=new Date();
 const rev=a=>a.reduce((s,o)=>s+tot(o),0);
 const prof=a=>a.reduce((s,o)=>s+(+o.price||0)-(+o.cost||0),0);
 const wk=new Date(now);wk.setDate(now.getDate()-6);wk.setHours(0,0,0,0);
 const week=d.filter(o=>o.date>=wk.getTime());
 const mo=d.filter(o=>{const x=new Date(o.date);return x.getMonth()===now.getMonth()&&x.getFullYear()===now.getFullYear()});
 const k=(t,v)=>`<div class="card kpi"><span class="mu">${t}</span><b>${fm(v)}</b></div>`;
 const byM={};d.forEach(o=>{const x=new Date(o.date),key=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");byM[key]=(byM[key]||0)+tot(o)});
 const ms=Object.entries(byM).sort().reverse().slice(0,6),mx=Math.max(1,...ms.map(m=>m[1]));
 const byC={};orders.forEach(o=>{const c=byC[o.phone]||(byC[o.phone]={n:o.name,c:0,s:0});c.c++;c.s+=tot(o)});
 const top=Object.values(byC).sort((a,b)=>b.c-a.c||b.s-a.s).slice(0,5);
 return `<p class="mu">الأرقام محسوبة من الطلبات المكتملة فقط. الإيراد = المنتج + التوصيل، والربح = سعر المنتج − التكلفة.</p>
 <div class="grid">${k("إيراد الأسبوع (آخر 7 أيام)",rev(week))}${k("إيراد الشهر",rev(mo))}${k("ربح الأسبوع",prof(week))}${k("ربح الشهر",prof(mo))}${k("إجمالي الإيرادات",rev(d))}${k("إجمالي الأرباح",prof(d))}</div>
 <h3>الإيرادات الشهرية</h3><div class="card">${ms.length?ms.map(([m,v])=>`<div style="margin-bottom:8px"><div class="row"><span>${m}</span><b>${fm(v)}</b></div><div class="bar" style="width:${v/mx*100}%"></div></div>`).join(""):'<span class="mu">لا توجد بيانات بعد</span>'}</div>
 <h3>أكثر العملاء طلباً</h3><div class="card">${top.length?top.map((c,i)=>`<div class="row" style="padding:6px 0"><span>${i+1}. ${esc(c.n)}</span><span class="mu">${c.c} طلب • ${fm(c.s)}</span></div>`).join(""):'<span class="mu">لا توجد بيانات بعد</span>'}</div>`;
}
function render(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
 $("#app").innerHTML=tab==="list"?list():tab==="new"?form():stats();
 scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
